name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arm64-build:
    name: Apple Silicon arm64 canonical native release simulation
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: 配置 portable Go 工具链
        uses: actions/setup-go@v6
        with:
          go-version-file: portable-runtime/go.mod
          cache: false

      - name: Verify runner architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          go version

      - name: 真实 macOS arm64 发布全链路模拟
        shell: bash
        run: bash scripts/simulate-release.sh

      - name: Upload Xcode diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-diagnostics-${{ github.run_id }}
          path: build/xcodebuild-release.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: MihomoCoreManager-native-release-parity
          path: |
            dist/
            build/release-simulation-verify/

      - uses: actions/upload-artifact@v6
        with:
          name: MihomoCoreManager-portable-regression-only
          path: dist-portable/
