name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arm64-build:
    name: Apple Silicon arm64 build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: 配置 portable Go 工具链
        uses: actions/setup-go@v6
        with:
          go-version-file: portable-runtime/go.mod
          cache: false

      - name: Verify runner architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = "arm64"

      - name: Source gate
        run: |
          python3 scripts/validate-source.py
          python3 scripts/build-source-manifest.py --check

      - name: Build arm64 app and installer assets
        run: bash scripts/build-release.sh --unsigned

      - name: Portable release parity test
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd portable-runtime && CGO_ENABLED=0 go test ./...)
          bash scripts/build-portable-installer.sh

      - name: Verify binary architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          BIN="build/DerivedData/Build/Products/Release/MihomoCoreManager.app/Contents/MacOS/MihomoCoreManager"
          test "$(lipo -archs "$BIN" | xargs)" = "arm64"

      - uses: actions/upload-artifact@v6
        with:
          name: MihomoCoreManager-arm64-unsigned
          path: |
            dist/
            dist-portable/
