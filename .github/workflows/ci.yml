name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-build:
    name: Apple Silicon arm64 full release simulation
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: 配置 portable Go 工具链
        uses: actions/setup-go@v6
        with:
          go-version-file: portable-runtime/go.mod
          cache: false

      - name: Verify runner architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      # PR/main must commit generated source metadata. The strict release
      # preflight may self-refresh it later, but CI catches stale manifests first.
      - name: Verify committed source manifest
        run: python3 scripts/build-source-manifest.py --check

      - name: Full release simulation
        shell: bash
        run: bash scripts/simulate-release.sh --strict-macos

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-release-log
          path: build/xcodebuild-release.log
          if-no-files-found: ignore

      - name: Upload verified release artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: MihomoCoreManager-v1.2.6-arm64-release-simulation
          path: |
            dist/
            dist-portable/
