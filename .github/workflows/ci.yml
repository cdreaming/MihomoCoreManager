name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arm64-build:
    name: arm64 dual implementation release simulation (macOS Intel cross-build)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: 配置 GoWebUI Go 工具链
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
          cache: false

      - name: Verify GoWebUI release lock
        run: python3 scripts/build-gowebui-release-lock.py --check

      - name: Verify host and arm64 target toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = "x86_64"
          echo "host=$(uname -m); release-target=arm64"
          xcodebuild -version
          go version

      - name: macOS Intel 主机交叉构建 arm64 双实现发布模拟
        shell: bash
        run: bash scripts/simulate-release.sh

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: build/xcodebuild-release.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: MihomoManager-dual-release
          path: dist/

      - uses: actions/upload-artifact@v6
        with:
          name: MihomoManager-GoWebUI-portable-preview
          path: dist-portable/
