name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-build:
    name: Apple Silicon arm64 full release simulation
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: 配置 portable Go 工具链
        uses: actions/setup-go@v6
        with:
          go-version-file: portable-runtime/go.mod
          cache: false

      - name: Verify runner architecture and toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          go version

      # SOURCE-SHA256SUMS.txt is generated metadata.  v1.2.5 release proved
      # that release/CI must refresh it from the exact checkout before any hard
      # check; otherwise harmless carried-forward release notes can block Xcode.
      - name: Refresh source manifest from exact checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/build-source-manifest.py --write
          python3 scripts/build-source-manifest.py --check
          if ! git diff --quiet -- SOURCE-SHA256SUMS.txt; then
            echo "::warning::Committed SOURCE-SHA256SUMS.txt was stale; regenerated from this exact checkout."
          fi

      - name: Full release simulation
        shell: bash
        run: bash scripts/simulate-release.sh --strict-macos

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-release-log-${{ github.run_id }}
          path: build/xcodebuild-release.log
          if-no-files-found: ignore

      - name: Upload verified release artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: MihomoCoreManager-v1.2.6-arm64-release-simulation
          path: |
            dist/
            dist-portable/
            build/release-simulation-verify/
          if-no-files-found: warn
