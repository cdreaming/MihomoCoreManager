permissions:
  contents: write

jobs:
  release:
    name: arm64 未签名 / PKG 发布
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 portable Go 工具链
        uses: actions/setup-go@v6
        with:
          go-version-file: portable-runtime/go.mod
          cache: false

      - name: 校验 portable Go 工具链
        shell: bash
        run: |
          set -Eeuo pipefail
          go version
          (cd portable-runtime && CGO_ENABLED=0 go test ./...)

      - name: 解析并校验版本
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            REQUESTED="${GITHUB_REF_NAME#v}"
          else
            REQUESTED="${MANUAL_VERSION#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REQUESTED" == "$VERSION" ]] || {
            echo "请求版本 v${REQUESTED} 与 VERSION v${VERSION} 不一致" >&2
            exit 1
          }
          [[ "$(uname -m)" == "arm64" ]] || { echo "Release runner 必须为 arm64" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: 源码发布门禁
        run: |
          python3 scripts/validate-source.py
          python3 scripts/build-source-manifest.py --check


      - name: 构建 arm64 未签名版本并生成 PKG
        shell: bash
        run: bash scripts/build-release.sh --unsigned

      - name: 构建已验证的 portable arm64 安装包
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/build-portable-installer.sh
          PORTABLE="dist-portable/MihomoCoreManager-v${{ steps.version.outputs.version }}-arm64-portable-installer.zip"
          printf '%s  %s\n' "$(shasum -a 256 "$PORTABLE" | awk '{print $1}')" "$(basename "$PORTABLE")" >> dist/SHA256SUMS.txt

      - name: 为 workflow_dispatch 准备 tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [[ "$(git rev-list -n 1 "$TAG")" == "$(git rev-parse HEAD)" ]] || {
              echo "$TAG 已存在但不指向当前 commit" >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          NOTES="docs/releases/v${VERSION}/RELEASE-NOTES.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" --title "$TAG"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" dist/* dist-portable/* --clobber

      - name: 在线回读 Release 资产并验证 SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          VERIFY="$RUNNER_TEMP/release-verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          gh release download "$TAG" -D "$VERIFY"
          cd "$VERIFY"
          shasum -a 256 -c SHA256SUMS.txt
          test -f "MihomoCoreManager-${TAG}-arm64.pkg"
          test -f "MihomoCoreManager-${TAG}-arm64.zip"
          test -f "MihomoCoreManager-${TAG}-arm64-portable-installer.zip"
          echo "GitHub Release online verification: PASS"
