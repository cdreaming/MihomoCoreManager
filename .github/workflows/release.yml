name: macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本，例如 1.3.1 或 v1.3.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: arm64 双实现发布（GoWebUI + SwiftUI）
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 GoWebUI Go 工具链
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
          cache: false

      - name: Verify GoWebUI release lock
        run: python3 scripts/build-gowebui-release-lock.py --check

      - name: 解析并校验版本
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER="$(tr -d '[:space:]' < BUILD_NUMBER)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            REQUESTED="${GITHUB_REF_NAME#v}"
          else
            REQUESTED="${MANUAL_VERSION#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$REQUESTED" == "$VERSION" ]] || {
            echo "请求版本 v${REQUESTED} 与 VERSION v${VERSION} 不一致" >&2
            exit 1
          }
          [[ "$(uname -m)" == "arm64" ]] || { echo "Release runner 必须为 arm64" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: 双实现发布全链路模拟
        shell: bash
        run: bash scripts/simulate-release.sh

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics-${{ github.run_id }}
          path: |
            build/xcodebuild-release.log
            dist-portable/
          if-no-files-found: ignore

      - name: 为 workflow_dispatch 准备 tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [[ "$(git rev-list -n 1 "$TAG")" == "$(git rev-parse HEAD)" ]] || {
              echo "$TAG 已存在但不指向当前 commit" >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          NOTES="docs/releases/v${VERSION}/RELEASE-NOTES.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" --title "$TAG"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: 在线回读正式资产并验证
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          VERIFY="$RUNNER_TEMP/release-verify"
          rm -rf "$VERIFY" && mkdir -p "$VERIFY"
          gh release download "$TAG" -D "$VERIFY"
          cd "$VERIFY"
          shasum -a 256 -c SHA256SUMS.txt
          test -f "MihomoCoreManager-v${VERSION}-GoWebUI-arm64.pkg"
          test -f "MihomoCoreManager-v${VERSION}-SwiftUI-arm64.pkg"
          grep -Fq 'variant=GoWebUI' GoWebUI-RELEASE-PROVENANCE.txt
          grep -Fq 'variant=SwiftUI' SwiftUI-RELEASE-PROVENANCE.txt
          echo "GitHub Release online verification: PASS (GoWebUI.pkg + SwiftUI.pkg)"
