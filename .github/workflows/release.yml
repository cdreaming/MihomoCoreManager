name: macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本，例如 1.0.9 或 v1.0.9'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: arm64 签名 / 公证 / PKG 发布
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 解析并校验版本
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            REQUESTED="${GITHUB_REF_NAME#v}"
          else
            REQUESTED="${MANUAL_VERSION#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$REQUESTED" == "$VERSION" ]] || {
            echo "请求版本 v${REQUESTED} 与 VERSION v${VERSION} 不一致" >&2
            exit 1
          }
          [[ "$(uname -m)" == "arm64" ]] || { echo "Release runner 必须为 arm64" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: 源码发布门禁
        run: |
          python3 scripts/validate-source.py
          python3 scripts/build-source-manifest.py --check

      - name: 校验签名与公证 Secrets
        shell: bash
        env:
          APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -Eeuo pipefail
          for name in APP_P12 APP_P12_PASSWORD INSTALLER_P12 INSTALLER_P12_PASSWORD API_KEY API_KEY_ID API_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "缺少 Release Secret: $name" >&2; exit 1; }
          done

      - name: 导入 Developer ID 证书
        id: signing
        shell: bash
        env:
          APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -Eeuo pipefail
          KEYCHAIN="$RUNNER_TEMP/mihomo-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          APP_CERT="$RUNNER_TEMP/app-cert.p12"
          INSTALLER_CERT="$RUNNER_TEMP/installer-cert.p12"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"

          printf '%s' "$APP_P12" | base64 -D > "$APP_CERT"
          printf '%s' "$INSTALLER_P12" | base64 -D > "$INSTALLER_CERT"
          printf '%s' "$API_KEY" | base64 -D > "$NOTARY_KEY"
          chmod 600 "$NOTARY_KEY"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APP_CERT" -k "$KEYCHAIN" -P "$APP_P12_PASSWORD" -T /usr/bin/codesign
          security import "$INSTALLER_CERT" -k "$KEYCHAIN" -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/Developer ID Application/{print $2; exit}')"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | awk -F '"' '/Developer ID Installer/{print $2; exit}')"
          [[ -n "$APP_IDENTITY" ]] || { echo '找不到 Developer ID Application identity' >&2; exit 1; }
          [[ -n "$INSTALLER_IDENTITY" ]] || { echo '找不到 Developer ID Installer identity' >&2; exit 1; }

          echo "app_identity=$APP_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "installer_identity=$INSTALLER_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "notary_key=$NOTARY_KEY" >> "$GITHUB_OUTPUT"

      - name: 构建 arm64、签名、公证并生成 PKG
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION: ${{ steps.signing.outputs.app_identity }}
          DEVELOPER_ID_INSTALLER: ${{ steps.signing.outputs.installer_identity }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/build-release.sh --signed

      - name: 为 workflow_dispatch 准备 tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [[ "$(git rev-list -n 1 "$TAG")" == "$(git rev-parse HEAD)" ]] || {
              echo "$TAG 已存在但不指向当前 commit" >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          NOTES="docs/releases/v${VERSION}/RELEASE-NOTES.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" --title "$TAG"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: 在线回读 Release 资产并验证 SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          VERIFY="$RUNNER_TEMP/release-verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          gh release download "$TAG" -D "$VERIFY"
          cd "$VERIFY"
          shasum -a 256 -c SHA256SUMS.txt
          test -f "MihomoCoreManager-${TAG}-arm64.pkg"
          test -f "MihomoCoreManager-${TAG}-arm64.zip"
          echo "GitHub Release online verification: PASS"
